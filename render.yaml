services:
  - type: web
    name: restamp-backend
    runtime: python
    region: oregon          # Change to the region closest to your users
    plan: free              # Upgrade to starter/standard for production
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health

    envVars:
      # ── Runtime environment ────────────────────────────────────────────────
      # Explicit production posture: enables the startup security gate (JWT
      # secret strength, Google dev off, CORS without '*'). Behavior matches
      # the automatic production detection; this only makes the intent
      # explicit in the blueprint.
      - key: RESTAMP_ENV
        value: "production"

      # ── Trusted reverse proxy ──────────────────────────────────────────────
      # Render terminates HTTPS behind its proxy: the socket peer is always
      # the proxy, so per-IP OTP throttling would see one shared IP.
      # RESTAMP_TRUST_PROXY=1 makes the app derive the client IP from the
      # rightmost X-Forwarded-For entry added by the trusted platform proxy.
      # Only enable this where requests REALLY arrive via a trusted proxy;
      # unset it when the service is directly exposed to the internet.
      - key: RESTAMP_TRUST_PROXY
        value: "1"

      # ── Database ────────────────────────────────────────────────────────────
      # Paste your Render PostgreSQL (or external MySQL) internal URL here.
      # Format (PostgreSQL): postgresql+psycopg2://USER:PASSWORD@HOST:PORT/DBNAME
      # Format (MySQL):       mysql+pymysql://USER:PASSWORD@HOST:PORT/DBNAME
      - key: RESTAMP_DATABASE_URL
        sync: false           # Set this manually in the Render dashboard

      # ── JWT ─────────────────────────────────────────────────────────────────
      # RESTAMP_JWT_SECRET
      # generateValue allows Render to auto-generate a secure random string.
      # VERIFY ONCE IN THE DASHBOARD: the startup security gate requires the
      # generated secret to be at least 32 characters long — regenerate or
      # replace it if Render's generated value turns out to be shorter.
      - key: RESTAMP_JWT_SECRET
        generateValue: true   # Render auto-generates a secure random string

      - key: RESTAMP_JWT_EXPIRE_MINUTES
        value: "30"

      # ── OTP ─────────────────────────────────────────────────────────────────
      # OTP codes are NEVER returned in API responses. OTP DELIVERY IS NOT
      # CONNECTED YET: the codebase contains no SMS vendor and there are no
      # SMS env vars to configure. Until delivery is connected in code (see
      # app/services/otp.py — a code change is required, no dashboard-only
      # toggle exists), OTP requests fail closed with a generic 503 and
      # phone-OTP login stays unavailable.
      # The ONLY response-disclosure seam is the temporary internal-testing
      # display mode below — it MUST stay "0" on this production service:
      # production startup refuses the flag (validate_security_config) and
      # the OTP service independently re-checks the production
      # classification on every request.
      - key: RESTAMP_OTP_DISPLAY_MODE
        value: "0"
      - key: RESTAMP_OTP_TTL_SECONDS
        value: "300"
      - key: RESTAMP_OTP_MAX_REQUESTS_PER_HOUR
        value: "5"
      - key: RESTAMP_OTP_MAX_VERIFY_ATTEMPTS
        value: "5"
      - key: RESTAMP_OTP_BLOCK_SECONDS
        value: "900"

      # ── Restricted production test login (NO SMS provider) ────────────────
      # /auth/test-login lets authorized testers log in by phone WITHOUT an
      # SMS provider while delivery is deferred — with NO OTP generated,
      # returned, or logged (separate from the OTP display mode above).
      # Disabled by default (flag "0" AND empty key): the endpoint answers
      # the same 404 as an unknown route. To use it for a bounded testing
      # window: set RESTAMP_TEST_LOGIN_ENABLED="1" AND RESTAMP_TEST_LOGIN_KEY
      # to a strong random value (>= 32 chars, never in this file) in the
      # Render dashboard; production startup REFUSES a weak/missing key.
      # ONLY phones explicitly listed in RESTAMP_TEST_LOGIN_ALLOWED_PHONES
      # (comma-separated "+91..." Indian mobiles) can log in — ANY other
      # phone is rejected (403) even with a valid key, and an EMPTY list
      # rejects EVERY phone (fail closed). The list is the ONLY permission
      # to USE the endpoint. Account CREATION is a separate flag:
      # RESTAMP_TEST_LOGIN_ALLOW_REGISTRATION below ("0" default = existing
      # allowlisted accounts only; "1" also lets an allowlisted UNKNOWN
      # phone register). Set ENABLED back to
      # "0" (and/or rotate the key and empty the list) when testing is done.
      # Attempts are rate limited per IP (10/hr default) and per phone
      # (20/hr default) for OTP_BLOCK_SECONDS after tripping.
      - key: RESTAMP_TEST_LOGIN_ENABLED
        value: "0"
      - key: RESTAMP_TEST_LOGIN_KEY
        sync: false           # Set this manually in the Render dashboard
      - key: RESTAMP_TEST_LOGIN_ALLOWED_PHONES
        value: ""             # comma-separated +91 numbers; empty = all rejected
      - key: RESTAMP_TEST_LOGIN_ALLOW_REGISTRATION
        value: "0"            # "1" also lets allowlisted UNKNOWN phones register
      - key: RESTAMP_TEST_LOGIN_MAX_PER_HOUR_PER_IP
        value: "10"
      - key: RESTAMP_TEST_LOGIN_MAX_PER_HOUR_PER_PHONE
        value: "20"

      # ── CORS ────────────────────────────────────────────────────────────────
      # Exact production frontend origin(s) only. Never "*" with credentials.
      - key: RESTAMP_CORS_ORIGINS
        value: "https://restamp-app.vercel.app,https://restamp-alpha.vercel.app"

      # ── Google OAuth (optional) ──────────────────────────────────────────────
      - key: RESTAMP_GOOGLE_CLIENT_ID
        value: ""
      - key: RESTAMP_GOOGLE_DEV_MODE
        value: "0"
