services:
  - type: web
    name: restamp-backend
    runtime: python
    region: oregon          # Change to the region closest to your users
    plan: free              # Upgrade to starter/standard for production
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health

    envVars:
      # ── Runtime environment ────────────────────────────────────────────────
      # Explicit production posture: enables the startup security gate (JWT
      # secret strength, OTP debug/demo flags off, Google dev off, CORS
      # without '*'). Behavior matches the automatic production detection;
      # this only makes the intent explicit in the blueprint.
      - key: RESTAMP_ENV
        value: "production"

      # ── Trusted reverse proxy ──────────────────────────────────────────────
      # Render terminates HTTPS behind its proxy: the socket peer is always
      # the proxy, so per-IP OTP throttling would see one shared IP.
      # RESTAMP_TRUST_PROXY=1 makes the app derive the client IP from the
      # rightmost X-Forwarded-For entry added by the trusted platform proxy.
      # Only enable this where requests REALLY arrive via a trusted proxy;
      # unset it when the service is directly exposed to the internet.
      - key: RESTAMP_TRUST_PROXY
        value: "1"

      # ── Database ────────────────────────────────────────────────────────────
      # Paste your Render PostgreSQL (or external MySQL) internal URL here.
      # Format (PostgreSQL): postgresql+psycopg2://USER:PASSWORD@HOST:PORT/DBNAME
      # Format (MySQL):       mysql+pymysql://USER:PASSWORD@HOST:PORT/DBNAME
      - key: RESTAMP_DATABASE_URL
        sync: false           # Set this manually in the Render dashboard

      # ── JWT ─────────────────────────────────────────────────────────────────
      # RESTAMP_JWT_SECRET
      # generateValue allows Render to auto-generate a secure random string.
      # VERIFY ONCE IN THE DASHBOARD: the startup security gate requires the
      # generated secret to be at least 32 characters long — regenerate or
      # replace it if Render's generated value turns out to be shorter.
      - key: RESTAMP_JWT_SECRET
        generateValue: true   # Render auto-generates a secure random string

      - key: RESTAMP_JWT_EXPIRE_MINUTES
        value: "30"

      # ── OTP ─────────────────────────────────────────────────────────────────
      # OTP codes are NEVER returned in API responses (debug_code appears only
      # when RESTAMP_OTP_DEBUG=1, which must stay "0" in production).
      # RESTAMP_OTP_DEMO_MODE enables fixed demo codes for local demos only;
      # it MUST stay "0" in production.
      - key: RESTAMP_OTP_DEBUG
        value: "0"
      - key: RESTAMP_OTP_DEMO_MODE
        value: "0"
      - key: RESTAMP_OTP_TTL_SECONDS
        value: "300"
      - key: RESTAMP_OTP_MAX_REQUESTS_PER_HOUR
        value: "5"
      - key: RESTAMP_OTP_MAX_VERIFY_ATTEMPTS
        value: "5"
      - key: RESTAMP_OTP_BLOCK_SECONDS
        value: "900"

      # ── CORS ────────────────────────────────────────────────────────────────
      # Exact production frontend origin(s) only. Never "*" with credentials.
      - key: RESTAMP_CORS_ORIGINS
        value: "https://restamp-app.vercel.app,https://restamp-alpha.vercel.app"

      # ── Google OAuth (optional) ──────────────────────────────────────────────
      - key: RESTAMP_GOOGLE_CLIENT_ID
        value: ""
      - key: RESTAMP_GOOGLE_DEV_MODE
        value: "0"
