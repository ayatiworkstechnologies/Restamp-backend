services:
  - type: web
    name: restamp-backend
    runtime: python
    region: oregon          # Change to the region closest to your users
    plan: free              # Upgrade to starter/standard for production
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health

    envVars:
      # ── Runtime environment ────────────────────────────────────────────────
      # REQUIRED: production is decided by RESTAMP_ENV alone (never by the
      # database host) and startup refuses an unset/unknown value. Enables the
      # startup security gate (JWT secret strength, Google dev off, explicit
      # https CORS origins).
      - key: RESTAMP_ENV
        value: "production"

      # ── Database ────────────────────────────────────────────────────────────
      # Paste your Render PostgreSQL (or external MySQL) internal URL here.
      # Format (PostgreSQL): postgresql+psycopg2://USER:PASSWORD@HOST:PORT/DBNAME
      # Format (MySQL):       mysql+pymysql://USER:PASSWORD@HOST:PORT/DBNAME
      - key: RESTAMP_DATABASE_URL
        sync: false           # Set this manually in the Render dashboard

      # ── JWT ─────────────────────────────────────────────────────────────────
      # RESTAMP_JWT_SECRET
      # generateValue allows Render to auto-generate a secure random string.
      # VERIFY ONCE IN THE DASHBOARD: the startup security gate requires the
      # generated secret to be at least 32 characters long — regenerate or
      # replace it if Render's generated value turns out to be shorter.
      - key: RESTAMP_JWT_SECRET
        generateValue: true   # Render auto-generates a secure random string

      - key: RESTAMP_JWT_EXPIRE_MINUTES
        value: "30"

      # ── OTP ─────────────────────────────────────────────────────────────────
      # The simplified login uses ONE fixed testing code (349086) that is
      # environment-gated to local/staging. In production: OTP requests fail
      # closed with a generic 503, every code is rejected (401), and no OTP
      # is ever returned in a response. There are no OTP environment
      # variables; the removed RESTAMP_OTP_DISPLAY_MODE/_TTL_SECONDS/_MAX_* /
      # _BLOCK_SECONDS must NOT be re-added here (production refuses to boot
      # with the display flag set).

      # ── CORS ────────────────────────────────────────────────────────────────
      # REQUIRED in production and the ONLY allowed browser origins: exact
      # https origins, no path/trailing slash, never "*", never localhost/LAN.
      - key: RESTAMP_CORS_ORIGINS
        value: "https://restamp.in,https://www.restamp.in,https://restamp-alpha.vercel.app,https://restamp-app.vercel.app"

      # ── Google OAuth (optional) ──────────────────────────────────────────────
      - key: RESTAMP_GOOGLE_CLIENT_ID
        value: ""
      - key: RESTAMP_GOOGLE_DEV_MODE
        value: "0"
