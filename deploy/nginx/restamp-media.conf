# RESTAMP Production Nginx Configuration
# Media Static File Serving & Reverse Proxy
# Canonical Storage Root: /var/lib/restamp/property-photos/listings/

# Rate limiting zone for public media requests (prevents scraping storms)
limit_req_zone $binary_remote_addr zone=media_limit:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name api.restamp.in;

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.restamp.in;

    # SSL Certificates (Managed via Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/api.restamp.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.restamp.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Maximum upload size for POST requests (covers up to 10 MB per image)
    client_max_body_size 15M;

    # --------------------------------------------------------------------------
    # Public Property Photo Serving (/media/<listing_id>/<uuid>.<ext>)
    # --------------------------------------------------------------------------
    # Direct static file delivery bypassing FastAPI / Python workers
    location /media/ {
        # Restrict HTTP methods: only GET and HEAD are permitted for static media
        limit_except GET HEAD {
            deny all;
        }

        # Rate limiting to mitigate bulk scraping
        limit_req zone=media_limit burst=50 nodelay;

        # Maps /media/<path> to /var/lib/restamp/property-photos/<path>
        # e.g. /media/123/abc.jpg -> /var/lib/restamp/property-photos/listings/123/abc.jpg
        # Since app stores files under <RESTAMP_MEDIA_ROOT>/listings/<listing_id>/<uuid>.<ext>
        alias /var/lib/restamp/property-photos/listings/;

        # Restrict file extensions strictly to allowed property photo formats
        location ~* ^/media/([0-9]+)/([a-f0-9]{32})\.(jpg|jpeg|png|webp)$ {
            alias /var/lib/restamp/property-photos/listings/$1/$2.$3;

            # Browser & CDN Caching: photos use immutable UUIDs, cache for 30 days
            expires 30d;
            add_header Cache-Control "public, no-transform, immutable";

            # Security Headers for Media Files
            add_header X-Content-Type-Options "nosniff" always;
            add_header Access-Control-Allow-Origin "*" always;

            # Disable directory listing and execution
            autoindex off;

            # Performance Optimizations
            sendfile on;
            tcp_nopush on;
            tcp_nodelay on;

            try_files "" =404;
        }

        # Deny any other pattern or path traversal under /media/
        return 404;
    }

    # --------------------------------------------------------------------------
    # FastAPI Backend Application Proxy
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts for file uploads
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Disable buffering for streaming uploads
        proxy_request_buffering off;
    }
}
