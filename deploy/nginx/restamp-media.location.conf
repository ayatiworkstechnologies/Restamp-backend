# RESTAMP property-photo delivery — Nginx LOCATION SNIPPET (not a full vhost)
#
# Include this file INSIDE the existing, verified HTTPS `server { ... }` block
# of the API host (the one that already proxies to the backend and holds the
# TLS certificate), e.g.:
#
#     server {
#         listen 443 ssl;
#         server_name <API_HOST>;            # existing, unchanged
#         ...
#         client_max_body_size 12m;          # see "Upload size" below
#         include /etc/nginx/snippets/restamp-media.location.conf;
#         location / { proxy_pass ...; }     # existing, unchanged
#     }
#
# It does not touch TLS, server_name or the proxy, so it cannot replace or
# break the live API configuration. Always run `sudo nginx -t` before reload.
#
# Mapping (the backend writes <RESTAMP_MEDIA_ROOT>/listings/<id>/<uuid>.<ext>
# and builds URLs <RESTAMP_MEDIA_PUBLIC_BASE_URL>/media/<id>/<uuid>.<ext>):
#
#     https://<API_HOST>/media/2197/8f2a...c91.jpg
#       -> /var/www/restamp/uploads/listings/2197/8f2a...c91.jpg
#
# If RESTAMP_MEDIA_ROOT differs from /var/www/restamp/uploads, change the one
# `alias` line below to <RESTAMP_MEDIA_ROOT>/listings/... accordingly.
#
# Upload size: the server-level `client_max_body_size` must be at least
# RESTAMP_PHOTO_MAX_BYTES plus ~1 MiB of multipart overhead. With the default
# RESTAMP_PHOTO_MAX_BYTES (10 MiB) use `client_max_body_size 12m;`. Raise both
# together, never only one.

# ^~ : once /media/ matches, no server-level regex location (e.g. a generic
# "~* \.(jpg|png)$" static rule) can take over these requests.
location ^~ /media/ {
    # Read-only: GET/HEAD only (everything else 403).
    limit_except GET HEAD {
        deny all;
    }

    # Only the exact names the backend generates: positive listing id, 32 hex
    # chars, one of the three written extensions. No dots, slashes or other
    # characters can reach the filesystem path, so traversal is impossible.
    location ~ "^/media/([1-9][0-9]{0,19})/([0-9a-f]{32})\.(jpg|png|webp)$" {
        # Regex alias with captures: maps to exactly one file. A missing file
        # is a plain 404 (no try_files — alias+try_files has known pitfalls).
        alias /var/www/restamp/uploads/listings/$1/$2.$3;

        # Correct, fixed MIME types regardless of the global mime.types.
        types {
            image/jpeg jpg;
            image/png  png;
            image/webp webp;
        }
        default_type application/octet-stream;

        autoindex off;

        # Names are random and never reused: safe to cache for a long time.
        # A single Cache-Control header (no `expires`, which would add a
        # second one).
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        # add_header in this block disables inheritance of server-level
        # add_header lines, so the security headers are repeated here.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Access-Control-Allow-Origin "*" always;

        access_log off;
        sendfile on;
    }

    # Anything else under /media/ (directory paths, other names/extensions,
    # encoded traversal attempts): 404. Never reaches the backend.
    return 404;
}
